<!doctype html>
<html lang="ar" dir="rtl">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Syria Cash | المنصة الرقمية</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00462a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- مكتبة Supabase للاتصال السحابي -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-light: #f4f6f9;
      --card-bg: #ffffff;
      --primary-green: #005a36;
      --primary-dark: #00462a;
      --accent-gold: #c59b27;
      --accent-gold-light: #fef3c7;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-red: #ef4444;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Kufi Arabic', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-light);
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-dark);
      padding-bottom: 95px;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #appSplashScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #00462a 0%, #001a10 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.5s ease;
    }

    .splash-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: splashPop 0.8s ease-out forwards;
    }

    .splash-flag-badge {
      width: 95px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 245, 160, 0.2);
      margin-bottom: 16px;
      animation: floatFlag 2.4s ease-in-out infinite alternate;
    }

    .splash-flag-green { background: #007a3d; height: 33.3%; }
    .splash-flag-white { 
      background: #ffffff; 
      height: 33.3%; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
      padding: 0 8px;
    }
    .splash-flag-black { background: #000000; height: 33.4%; }
    .splash-star { color: #ce1126; font-size: 13px; line-height: 1; }

    .splash-app-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .splash-app-title span { color: var(--accent-gold); }

    .splash-sub-title {
      font-size: 11px;
      color: #a7f3d0;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .splash-loader-bar-bg {
      width: 170px;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .splash-loader-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, var(--accent-gold), #00f5a0);
      border-radius: 10px;
      animation: splashFill 2.5s ease-in-out forwards;
    }

    @keyframes splashPop {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes floatFlag {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-6px) scale(1.03); }
    }

    @keyframes splashFill {
      0% { width: 0%; }
      60% { width: 75%; }
      100% { width: 100%; }
    }

    #offline-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--danger-red);
      color: white;
      text-align: center;
      padding: 8px;
      font-size: 12px;
      font-weight: bold;
      z-index: 10000;
    }

    .top-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-icons { display: flex; align-items: center; gap: 6px; }

    .icon-btn-outline {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-green);
      cursor: pointer;
      transition: all 0.15s;
    }
    .icon-btn-outline:active { background: #f1f5f9; transform: scale(0.95); }

    .lang-dropdown {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: bold;
      color: var(--primary-green);
      outline: none;
      cursor: pointer;
    }

    .official-brand { display: flex; flex-direction: column; align-items: flex-end; }
    body[dir="ltr"] .official-brand { align-items: flex-start; }

    .brand-row { display: flex; align-items: center; gap: 8px; }
    .syria-eagle { font-size: 20px; color: var(--accent-gold); line-height: 1; }

    .brand-name {
      font-size: 16px;
      font-weight: 900;
      color: var(--primary-green);
      letter-spacing: 0.5px;
    }

    .brand-sub { font-size: 9px; color: var(--text-muted); font-weight: 600; margin-top: -2px; }

    .syria-flag-badge {
      width: 22px;
      height: 14px;
      border-radius: 2px;
      overflow: hidden;
      display: inline-flex;
      flex-direction: column;
      border: 1px solid #cbd5e1;
    }
    .flag-green { background: #007a3d; height: 33.3%; }
    .flag-white { background: #ffffff; height: 33.3%; position: relative; display: flex; justify-content: space-around; align-items: center; }
    .flag-black { background: #000000; height: 33.4%; }
    .star { width: 2.5px; height: 2.5px; background: #ce1126; border-radius: 50%; }

    .ticker-bar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 6px 0;
      overflow: hidden;
      white-space: nowrap;
      font-size: 11px;
      color: var(--text-muted);
    }
    .ticker-content { display: inline-block; animation: tickerRun 25s linear infinite; }
    .ticker-item { display: inline-flex; align-items: center; gap: 6px; margin-right: 24px; }
    .ticker-badge { background: #e6f4ea; color: #0d652d; padding: 2px 7px; border-radius: 6px; font-weight: bold; }
    @keyframes tickerRun { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .container { padding: 14px; max-width: 480px; margin: 0 auto; }

    .airdrop-hero-banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      color: #ffffff;
      border: 2px solid #818cf8;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
      position: relative;
    }
    .airdrop-badge-top {
      position: absolute;
      top: 14px;
      left: 14px;
      background: #6366f1;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 8px;
    }
    body[dir="ltr"] .airdrop-badge-top { left: auto; right: 14px; }

    .airdrop-balance-big {
      font-size: 34px;
      font-weight: 900;
      color: #38bdf8;
      margin: 6px 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .airdrop-timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
      margin: 12px 0 10px 0;
    }
    .time-slot { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 6px 2px; }
    .time-num { font-size: 17px; font-weight: 900; color: #fde047; }
    .time-lbl { font-size: 9px; color: #cbd5e1; }

    .airdrop-progress-bar-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.15); border-radius: 10px; overflow: hidden; margin-top: 8px; }
    .airdrop-progress-fill { width: 4%; height: 100%; background: linear-gradient(90deg, #38bdf8, #00f5a0); border-radius: 10px; transition: width 0.3s; }

    .hero-banner {
      background: linear-gradient(135deg, #005a36 0%, #003822 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 90, 54, 0.22);
    }
    .hero-banner::after {
      content: "SYRIA CASH";
      position: absolute;
      left: -20px;
      bottom: -15px;
      font-size: 40px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.05);
      letter-spacing: 2px;
    }
    .hero-title { font-size: 12px; color: #a7f3d0; font-weight: 700; margin-bottom: 4px; }
    .hero-balance { font-size: 32px; font-weight: 900; display: flex; align-items: baseline; gap: 6px; }
    .hero-balance small { font-size: 16px; color: var(--accent-gold); }
    .hero-meta { font-size: 11px; color: #d1fae5; margin-top: 6px; display: flex; justify-content: space-between; }

    .section-header {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-header::before {
      content: "";
      width: 4px;
      height: 14px;
      background: var(--primary-green);
      border-radius: 2px;
      display: inline-block;
    }

    .services-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }

    .service-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .service-card:active { transform: scale(0.96); border-color: var(--primary-green); }

    .service-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-green);
    }
    .service-icon-wrap svg { width: 24px; height: 24px; stroke-width: 1.8; }

    .service-title { font-size: 12px; font-weight: 800; color: var(--text-dark); }
    .service-badge { font-size: 9px; font-weight: 700; color: var(--primary-green); background: #e6f4ea; padding: 2px 8px; border-radius: 10px; }

    .mining-hub-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .circle-mining-outer {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      border: 4px dashed var(--primary-green);
      margin: 12px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spinBorder 12s linear infinite;
      cursor: pointer;
    }
    .circle-mining-inner {
      width: 106px;
      height: 106px;
      border-radius: 50%;
      background: linear-gradient(135deg, #005a36, #003620);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(0, 90, 54, 0.3);
      animation: cancelSpin 12s linear infinite;
    }

    .circle-syc-outer { border-color: #6366f1; }
    .circle-syc-inner {
      background: linear-gradient(135deg, #4f46e5, #312e81);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    }

    @keyframes spinBorder { 100% { transform: rotate(360deg); } }
    @keyframes cancelSpin { 100% { transform: rotate(-360deg); } }

    .live-unclaimed-txt { font-size: 20px; font-weight: 900; color: var(--primary-green); margin-top: 8px; }

    .btn-official-green {
      width: 100%;
      background: linear-gradient(180deg, #005a36 0%, #004328 100%);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 90, 54, 0.2);
      transition: all 0.15s;
    }
    .btn-official-green:active { transform: translateY(2px); }

    /* التصميم المطور الاحترافي بقسم الألعاب */
    .games-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .game-card-modern {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }
    .game-card-modern:hover { border-color: var(--primary-green); transform: translateY(-2px); }

    .game-badge-status {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
    }
    body[dir="ltr"] .game-badge-status { right: auto; left: 12px; }
    
    .status-free { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .status-locked { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

    .jackpot-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      color: #ffffff;
      border: 2px solid var(--accent-gold);
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(197, 155, 39, 0.25);
    }
    .jackpot-val { font-size: 28px; font-weight: 900; color: #fbbf24; margin: 6px 0; }

    .scratch-wrap-clean {
      position: relative;
      width: 260px;
      height: 110px;
      margin: 14px auto;
      border-radius: 14px;
      overflow: hidden;
      border: 2px dashed var(--primary-green);
      background: #f0fdf4;
    }
    .scratch-secret-txt {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: var(--primary-green);
      font-size: 16px;
    }
    #scratchCanvas {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      z-index: 2;
      transition: opacity 0.3s;
    }

    .mystery-row { display: flex; justify-content: space-around; gap: 10px; margin: 14px 0; }
    .mystery-item {
      flex: 1;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 16px 8px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .mystery-item:active { transform: scale(0.92); border-color: var(--accent-gold); background: #fffdf0; }

    .slot-machine-box {
      background: #0f172a;
      border: 2px solid var(--accent-gold);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
    }
    .slot-reel {
      width: 60px;
      height: 70px;
      background: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.2);
    }

    .coin-box {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #d97706);
      border: 3px solid #fef08a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 14px auto;
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.35);
      transition: transform 0.6s ease;
    }

    .task-card-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }
    .task-info { display: flex; align-items: center; gap: 10px; }
    .task-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .official-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: var(--primary-dark);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 -8px 24px rgba(0, 70, 42, 0.25);
      padding: 0 2px;
    }

    .nav-link-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #94b8a3;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      gap: 2px;
      flex: 1;
      transition: all 0.15s;
    }
    .nav-link-btn svg { width: 19px; height: 19px; stroke-width: 1.8; }
    .nav-link-btn.active { color: #ffffff; transform: translateY(-2px); }
    .nav-link-btn.active svg { stroke: #a7f3d0; }

    .tab-view { display: none; }
    .tab-view.active { display: block; }

    .modal-backdrop-clean {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }
    .modal-box-clean {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      max-height: 85vh;
      overflow-y: auto;
    }

    .input-clean {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 12px;
      color: #0f172a;
      outline: none;
      margin-top: 4px;
    }
    .input-clean:focus { border-color: var(--primary-green); background: #ffffff; }

    .toast-clean {
      position: fixed;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-green);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: none;
      z-index: 1000;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    .ad-player-box {
      background: #000;
      border-radius: 12px;
      padding: 20px;
      color: #fff;
      margin: 12px 0;
    }
    .ad-sim-video {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ad-progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      margin-top: 12px;
      overflow: hidden;
    }
    .ad-progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #00f5a0;
      transition: width 1s linear;
    }
  
/* ===== SYRIA CASH PRO UI v1 ===== */
:root{
  --bg-light:#050706;
  --card-bg:rgba(17,20,19,.78);
  --prima
