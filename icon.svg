<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- خلفية صلبة معتمة تماماً لكي تتوافق مع نظام شاومي -->
  <rect width="512" height="512" fill="#07090e"/>
  
  <!-- إطار العلم الراقي -->
  <rect x="106" y="80" width="300" height="190" rx="16" fill="#111827" stroke="#1f2937" stroke-width="6"/>
  
  <!-- العلم السوري -->
  <g>
    <!-- الخط الأخضر -->
    <rect x="118" y="92" width="276" height="55" rx="8" fill="#007a3d"/>
    <!-- الخط الأبيض -->
    <rect x="118" y="147" width="276" height="55" fill="#ffffff"/>
    <!-- الخط الأسود -->
    <rect x="118" y="202" width="276" height="55" rx="8" fill="#000000"/>
    
    <!-- النجوم الحمراء الثلاث على الخط الأبيض -->
    <!-- النجمة الأولى -->
    <polygon points="186,174 188,181 195,181 189,185 191,192 186,188 181,192 183,185 177,181 184,181" fill="#ce1126"/>
    <!-- النجمة الثانية -->
    <polygon points="256,174 258,181 265,181 259,185 261,192 256,188 251,192 253,185 247,181 254,181" fill="#ce1126"/>
    <!-- النجمة الثالثة -->
    <polygon points="326,174 328,181 335,181 329,185 331,192 326,188 321,192 323,185 317,181 324,181" fill="#ce1126"/>
  </g>
  
  <!-- اسم التطبيق بارز وواضح -->
  <text x="256" y="345" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SYRIA CASH</text>
  
  <!-- خط تزييني سفلي مضيء -->
  <rect x="180" y="380" width="152" height="6" rx="3" fill="#00f5a0"/>
</svg>
